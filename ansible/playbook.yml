---
- name: Provisionar maquinas PenguinLab
  hosts: penguinlab
  become: true

  tasks:
    - name: Copiar script de provisionamento
      ansible.builtin.copy:
        src: ../provision-penguinlab.sh
        dest: /tmp/provision-penguinlab.sh
        mode: "0755"

    - name: Executar script de provisionamento
      ansible.builtin.command: /tmp/provision-penguinlab.sh
      environment:
        PENGUINLAB_PASSWORD: "{{ penguinlab_password | default('aluno') }}"
        PENGUINLAB_HOSTNAME: "{{ inventory_hostname }}"
      register: resultado
      changed_when: false

    - name: Exibir resultado do provisionamento
      ansible.builtin.debug:
        var: resultado.stdout_lines

    - name: Remover script temporario
      ansible.builtin.file:
        path: /tmp/provision-penguinlab.sh
        state: absent
      changed_when: false

