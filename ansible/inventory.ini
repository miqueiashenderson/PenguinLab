# PenguinLab - Inventario de maquinas do laboratorio
# Substitua os IPs abaixo pelos IPs reais de cada maquina.
#
# IMPORTANTE: ansible_user NUNCA deve ser "aluno" — o provision-penguinlab.sh
# bloqueia sudo desse usuario. Use a conta admin criada na instalacao do
# Ubuntu/Mint (ex: professor, admin, ou o primeiro usuario criado pelo instalador).
#
# Recomendacao: use chave SSH publica em vez de senha.
# Para configurar:
#   ssh-copy-id professor@penguinlab-01
#   ssh-copy-id professor@penguinlab-02
#   ... (repetir para todas as maquinas)

[penguinlab]
penguinlab-01 ansible_host=192.168.0.21
penguinlab-02 ansible_host=192.168.0.22
penguinlab-03 ansible_host=192.168.0.23
penguinlab-04 ansible_host=192.168.0.24
penguinlab-05 ansible_host=192.168.0.25
penguinlab-06 ansible_host=192.168.0.26
penguinlab-07 ansible_host=192.168.0.27
penguinlab-08 ansible_host=192.168.0.28
penguinlab-09 ansible_host=192.168.0.29
penguinlab-10 ansible_host=192.168.0.30
penguinlab-11 ansible_host=192.168.0.31
penguinlab-12 ansible_host=192.168.0.32
penguinlab-13 ansible_host=192.168.0.33
penguinlab-14 ansible_host=192.168.0.34

[all:vars]
ansible_user=professor
